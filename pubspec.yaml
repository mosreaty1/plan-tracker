name: egyptair_flight_tracker
description: EgyptAir Flight Lookup Application
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  flutter_spinkit: ^5.2.0
  google_fonts: ^6.2.1
  path_provider: ^2.1.2
  open_file: ^3.3.2
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/egyptair_logo.png
    - assets/logo_white.png
    - assets/logo_blue.png
    - assets/Mohamed_Alsariti_Itinerary.pdf
